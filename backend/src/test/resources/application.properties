# Configuracion exclusiva de los tests.
#
# El test de carga de contexto dependia de un MySQL real con la base de datos ya
# creada, asi que fallaba en cualquier maquina limpia y en CI. Con H2 en memoria
# se levanta el contexto entero sin infraestructura externa.

spring.datasource.url=jdbc:h2:mem:spotterai_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway apagado en tests: las migraciones estan escritas en SQL de MariaDB
# (ENGINE=InnoDB, BIT(1), COLLATE) y H2 no lo entiende. Aqui el esquema lo crea
# Hibernate desde las entidades, que es justo lo que los tests quieren probar.
spring.flyway.enabled=false

# Ojo: este fichero SUSTITUYE al application.properties principal, no lo
# complementa. Toda propiedad que la aplicacion necesite para arrancar tiene que
# estar tambien aqui.

# Valor ficticio: JwtUtil exige 32 caracteres o mas y no arranca sin ello.
# No es un secreto real, solo permite que el contexto se levante en tests.
spotterai.jwt.secret=clave-solo-para-tests-no-usar-en-produccion

spotterai.cors.allowed-origin=http://localhost:4200

# Avisos por correo. Apagados: el cartero que queda escribe en el registro, asi
# que ni la suite ni el arranque del contexto tocan un servidor SMTP.
spotterai.correo.activo=false
spotterai.correo.remitente=SpotterAI <no-responder@spotterai.test>
spotterai.correo.url-base=http://localhost:4200

# Muy espaciado a proposito: el barrido no tiene nada que hacer en los tests, y
# lo que se comprueba de el se comprueba llamandolo a mano con un reloj fijo.
spotterai.correo.cada-cuanto-ms=3600000
