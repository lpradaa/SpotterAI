# =============================================================================
#  The text the backend writes, in English.
#  -----------------------------------------------------------------------------
#  Keys come from messages_es.properties, which is the source of truth. A key
#  missing here falls back to the Spanish text, never to a bare key.
#
#  Watch the single quotes. For Java's MessageFormat a single quote escapes what
#  follows, so in any message that has {0}-style placeholders it must be written
#  doubled: "you''re", not "you're". In Spanish this hardly ever comes up; in
#  English it comes up constantly, and the symptom is a placeholder that renders
#  literally instead of being replaced.
# =============================================================================

