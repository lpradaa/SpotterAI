correo.restablecer.cuerpo=You asked to change your password. You can do it here:\n\n{0}/restablecer?t={1}\n\nThe link is valid for one hour and can only be used once.\n\nIf it was not you, there is nothing to do: as long as you do not open that link, your password stays as it was.\n

