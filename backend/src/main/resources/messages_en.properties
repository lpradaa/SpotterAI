# =============================================================================
#  The text the backend writes, in English.
#  -----------------------------------------------------------------------------
#  Keys come from messages_es.properties, which is the source of truth. A key
#  missing here falls back to the Spanish text, never to a bare key.
#
#  Watch the single quotes. For Java's MessageFormat a single quote escapes what
#  follows, so in any message that has {0}-style placeholders it must be written
#  doubled: "you''re", not "you're". In Spanish this hardly ever comes up; in
#  English it comes up constantly, and the symptom is a placeholder that renders
#  literally instead of being replaced.
# =============================================================================

# ===================== Compatibility label =====================
compat.etiqueta.excelente=Excellent match
compat.etiqueta.muy=Very compatible
compat.etiqueta.buena=Good match
compat.etiqueta.parcial=Partial match
compat.etiqueta.poca=Weak match

compat.titular={0} - {1}% compatible
compat.sinPuntosEnComun=We have not found any clear common ground between your profiles.

# ===================== Pieces that go inside other sentences =====================
comun.dias.uno=one day
comun.dias.varios={0} days
comun.horas.una=one hour
comun.horas.varias={0} hours

dia.LUNES=Monday
dia.MARTES=Tuesday
dia.MIERCOLES=Wednesday
dia.JUEVES=Thursday
dia.VIERNES=Friday
dia.SABADO=Saturday
dia.DOMINGO=Sunday

lista.dos={0} and {1}
lista.masDeDos={0} and {1}

# ===================== Factor: schedule =====================
factor.horario.sinDatos=One of the two profiles has no schedule set
factor.horario.sinSolape=Your schedules do not overlap at any point in the week
factor.horario.gimnasiosDistintos=You would overlap {0} a week, but you train at different gyms
factor.horario.alguienSeMueve=You would overlap {0} a week at different gyms, but one of you can travel
factor.horario.ambosFijos=You both always train {0} at the same time ({1})
factor.horario.solape=You overlap {0} a week on {1}

# ===================== Factor: strength =====================
factor.fuerza.sinDatos=There are no lifts in common to compare

# ===================== Factor: consistency =====================
factor.constancia.sinDatos=One of you has not logged any workouts yet

# ===================== Factor: routine =====================
factor.rutina.sinDatos=One of the two profiles has no routine set

# ===================== Factor: level =====================
factor.nivel.sinDatos=One of the two profiles has no level set
factor.nivel.igual=You both train at {0} level
factor.nivel.contiguos=You are one level apart ({0} and {1}), workable by adjusting the loads
factor.nivel.lejanos=There are two levels between {0} and {1}

# ===================== Factor: goal =====================
factor.objetivo.sinDatos=One of the two profiles has no goal set
factor.objetivo.igual=You are after the same thing: {0}
factor.objetivo.compatibles=Different but compatible goals: {0} and {1}
factor.objetivo.distintos=You train for different things: {0} versus {1}

# ===================== Factor names =====================
factor.nombre.horario=Schedules
factor.nombre.fuerza=Strength
factor.nombre.constancia=Consistency
factor.nombre.rutina=Routine
factor.nombre.nivel=Level
factor.nombre.objetivo=Goal
factor.nombre.gimnasio=Gym
factor.nombre.edad=Age
