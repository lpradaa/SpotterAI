# ===================== Nivel, objetivo y rutina =====================
# Se guardan en la base como texto en español —son de cuando no habia mas que un
# idioma— asi que la clave se construye normalizando lo guardado. El vocabulario
# es cerrado y lo fija el formulario del perfil; lo que no reconozcamos se enseña
# tal cual, que es mejor que un hueco.
