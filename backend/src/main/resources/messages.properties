# ===================== Los correos =====================
# Se mandan fuera de una peticion, asi que el idioma no sale de Accept-Language
# sino de la columna `idioma` del destinatario. Quien redacta es
# RedactorDeAvisos, que recibe ese idioma y se lo pasa a Textos.
#
# Los saltos de linea van como 
 literales: un .properties no admite valores de
# varias lineas sin escaparlos, y partidos a mano lo que queda es una clave rota
# y tres lineas sueltas que el fichero ignora en silencio.
correo.solicitud.asunto={0} quiere entrenar contigo
correo.solicitud.cuerpo={0} te ha mandado una solicitud en SpotterAI.\n\nPuedes aceptarla o rechazarla aquí:\n{1}/solicitudes\n\nSi no respondes no pasa nada: la solicitud se queda esperando.\n

correo.sesion.asunto={0} propone entrenar el {1}
correo.sesion.cuerpo={0} propone que entrenéis juntos:\n\n  {1}, de {2} a {3}{4}\n\nResponde aquí:\n{5}/conexiones?con={6}\n\nSi ese día no te viene bien, dilo y proponéis otro.\n
correo.sesion.donde=, en {0}

correo.restablecer.asunto=Recuperar tu contraseña de SpotterAI
correo.restablecer.cuerpo=Has pedido cambiar tu contraseña. Puedes hacerlo aquí:\n\n{0}/restablecer?t={1}\n\nEl enlace vale una hora y solo se puede usar una vez.\n\nSi no has sido tú, no hace falta que hagas nada: mientras no abras ese enlace, tu contraseña sigue siendo la de siempre.\n

# La salida va en todos los avisos y no solo en el primero: el correo que
# alguien abre cuando se harta es el que tiene delante.
correo.pieDeBaja=\n--\n¿No quieres estos avisos? Páralos aquí:\n{0}/baja?t={1}\n

# El dia de la propuesta. El nombre del dia y el del mes los sabe decir Java en
# los dos idiomas; lo que cambia entre ellos es el orden y las preposiciones, y
# eso es justo lo que no se puede pegar con concatenaciones.
correo.fecha.corta={0} {1}
correo.fecha.larga={0} {1} de {2}
