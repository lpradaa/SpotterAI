nivel.intermedio=Intermedio
nivel.avanzado=Avanzado

# La clave lleva guion bajo y no el espacio del valor guardado: en un .properties
# un espacio sin escapar separa la clave del valor, asi que "objetivo.perdida de
# peso" se leeria como la clave "objetivo.perdida" con valor "de peso=...". Lo
# normaliza quien construye la clave.
