# =============================================================================
#  Los textos que escribe el backend, en español.
#  -----------------------------------------------------------------------------
#  Este fichero manda: es el idioma en el que esta escrita la aplicacion y el que
#  se usa cuando falta una traduccion, de modo que un olvido enseña la frase
#  original y nunca una clave suelta.
#
#  Va sin sufijo de idioma, y no como messages_es.properties, por dos razones que
#  se descubrieron probandolo. La primera es que la autoconfiguracion de Spring
#  Boot solo crea el MessageSource si existe el fichero base: con solo _es y _en
#  queda un DelegatingMessageSource vacio y cualquier clave revienta con
#  NoSuchMessageException. La segunda es que asi el respaldo es este fichero para
#  todo lo que no sea ingles — un idioma que no conocemos ve español, que es el
#  comportamiento que se quiere, y no una clave.
#
#  Convencion: `area.caso`, de lo general a lo concreto.
#
#  Los huecos van con {0}, {1}… porque es lo que entiende MessageFormat de Java.
#  Ojo con las comillas simples: para MessageFormat, una comilla simple escapa lo
#  que viene detras, asi que en un texto con huecos hay que escribirla doblada.
#  Es la trampa clasica de este formato y en español, con los apostrofes, no
#  aparece casi nunca — pero en el fichero ingles si.
# =============================================================================

