spring.application.name=spotterai

# 1. BASE DE DATOS MYSQL
# Las credenciales se leen de variables de entorno; los valores tras ':' son
# el fallback de desarrollo local (MySQL de XAMPP sin contrasena).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spotterai_db}?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. HIBERNATE / JPA
# El esquema lo lleva Flyway (src/main/resources/db/migration). Hibernate ya no
# lo toca: "validate" solo comprueba que las entidades cuadren con las tablas y
# se niega a arrancar si no, en vez de cambiar la base por su cuenta.
spring.jpa.hibernate.ddl-auto=validate

# 2b. MIGRACIONES
# baseline-on-migrate marca la version 1 en una base que ya existia, sin volver
# a ejecutarla. En una base vacia, V1 la crea entera.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 3. SEGURIDAD
# Sin valor por defecto a proposito: la app no arranca si falta JWT_SECRET.
# Genera uno con: openssl rand -base64 48
spotterai.jwt.secret=${JWT_SECRET}

# 4. CORS
spotterai.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# 5. MEDIOS
# Carpeta donde se guardan las fotos y videos que sube la gente. Fuera del jar a
# proposito: los datos de usuario no viven dentro del artefacto que se despliega.
spotterai.medios.carpeta=${MEDIOS_DIR:medios}

# El limite real lo aplica AlmacenDeMedios (15 MB). Estos dos evitan que Tomcat
# rechace la peticion antes de llegar ahi y devuelva un error sin explicacion.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# 6. AVISOS POR CORREO
# Apagado salvo que se configure de verdad. Con esto en false la aplicacion
# funciona entera y los avisos se escriben en el registro —destinatario, asunto
# y cuerpo— en vez de mandarse: asi se ve que se habria enviado sin tener SMTP.
spotterai.correo.activo=${CORREO_ACTIVO:false}

# De donde parece que vienen los correos. Con CORREO_ACTIVO=true tiene que ser
# una direccion que el servidor de abajo tenga permitido usar como remitente.
spotterai.correo.remitente=${CORREO_REMITENTE:SpotterAI <no-responder@spotterai.local>}

# La raiz de los enlaces que van dentro del correo. Si esto se queda en
# localhost en produccion, los avisos salen con enlaces que no funcionan para
# nadie: es el fallo mas facil de cometer aqui y el mas dificil de notar, porque
# desde la maquina que los manda el enlace abre perfectamente.
spotterai.correo.url-base=${CORREO_URL_BASE:http://localhost:4200}

# Cada cuanto se mira si hay algo que avisar.
spotterai.correo.cada-cuanto-ms=${CORREO_CADA_CUANTO_MS:60000}

# El servidor. Sin CORREO_ACTIVO=true no se usa ninguno de estos.
spring.mail.host=${CORREO_HOST:localhost}
spring.mail.port=${CORREO_PUERTO:587}
spring.mail.username=${CORREO_USUARIO:}
spring.mail.password=${CORREO_CLAVE:}
spring.mail.properties.mail.smtp.auth=${CORREO_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${CORREO_TLS:true}
# Que un servidor lento no deje el barrido colgado indefinidamente.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# 7. DEBUGGING
# Cada consulta al registro. Util en desarrollo y una mala idea en produccion:
# llena el disco y deja los datos de la gente escritos en texto plano en los
# logs. Por eso es una variable y no un literal, y por eso vale false salvo que
# se pida — antes estaba puesto a true a secas para todo el mundo.
spring.jpa.show-sql=${SQL_AL_REGISTRO:false}

# 8. LO QUE NO SE LE CUENTA A QUIEN LLAMA
# Por defecto Spring ya no manda la traza, pero conviene dejarlo escrito: un
# error 500 con la traza dentro le regala a cualquiera la version de cada
# libreria y la estructura del paquete.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# La cabecera "Server: Apache-Tomcat/..." dice que hay debajo y con que version.
server.server-header=

# Sesion abierta durante el renderizado de la vista. Aqui no hay vistas de
# servidor —el frontend es Angular— asi que lo unico que hace es mantener
# conexiones cogidas de mas y esconder consultas perezosas fuera del servicio.
spring.jpa.open-in-view=false

# 9. LA SESION
# La galleta que lleva el token. Secure=false solo para desarrollo: en
# http://localhost una galleta Secure no se manda y nadie podria entrar. En
# cualquier despliegue de verdad va en true, y con HTTPS delante.
spotterai.sesion.cookie-segura=${COOKIE_SEGURA:false}

# 10. EL MOTOR
# El reparto de pesos entre los ocho factores de CalculadoraCompatibilidad.
# Antes eran constantes en el codigo: cambiar el peso del horario significaba
# recompilar y desplegar. El embudo de /api/metricas/embudo existe justo para
# poder decidir si estos numeros son los correctos, y ese dia hace falta poder
# probar otro reparto sin una nueva version del jar.
#
# Los valores de abajo son los de referencia (ver el javadoc de
# CalculadoraCompatibilidad): no hace falta que sumen 100, la redistribucion ya
# rescala en proporcion a lo que este disponible en cada pareja.
spotterai.motor.peso-horario=${PESO_HORARIO:40}
spotterai.motor.peso-nivel=${PESO_NIVEL:10}
spotterai.motor.peso-fuerza=${PESO_FUERZA:10}
spotterai.motor.peso-objetivo=${PESO_OBJETIVO:12}
spotterai.motor.peso-constancia=${PESO_CONSTANCIA:10}
spotterai.motor.peso-rutina=${PESO_RUTINA:5}
spotterai.motor.peso-gimnasio=${PESO_GIMNASIO:8}
spotterai.motor.peso-edad=${PESO_EDAD:5}

# 11. MODERACION
# Quien puede ver /api/reportes. Sin sistema de roles todavia: una lista de
# correos separados por comas es lo minimo que resuelve "que alguien pueda
# leer esto" sin construir infraestructura de roles para un equipo de
# moderacion que hoy no existe. Vacio por defecto: sin nadie en la lista, nadie
# ve los reportes, ni siquiera con una cuenta valida.
spotterai.admin.correos=${ADMIN_EMAILS:}

# =============================================================================
# 6. IDIOMA
# -----------------------------------------------------------------------------
# Los textos que escribe el backend viven en messages_*.properties. El fichero
# español manda: si falta una clave en el ingles se cae a el, de modo que un
# olvido enseña la frase original y nunca una clave suelta.
#
# UTF-8 explicito porque el formato .properties es Latin-1 por defecto, y esta
# aplicacion escribe en español: sin esto, "Coincidís" llega roto a la pantalla.
# =============================================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
