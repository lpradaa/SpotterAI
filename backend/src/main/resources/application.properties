spring.application.name=spotterai

# 1. BASE DE DATOS MYSQL
# Las credenciales se leen de variables de entorno; los valores tras ':' son
# el fallback de desarrollo local (MySQL de XAMPP sin contrasena).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spotterai_db}?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. HIBERNATE / JPA
# El esquema lo lleva Flyway (src/main/resources/db/migration). Hibernate ya no
# lo toca: "validate" solo comprueba que las entidades cuadren con las tablas y
# se niega a arrancar si no, en vez de cambiar la base por su cuenta.
spring.jpa.hibernate.ddl-auto=validate

# 2b. MIGRACIONES
# baseline-on-migrate marca la version 1 en una base que ya existia, sin volver
# a ejecutarla. En una base vacia, V1 la crea entera.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 3. SEGURIDAD
# Sin valor por defecto a proposito: la app no arranca si falta JWT_SECRET.
# Genera uno con: openssl rand -base64 48
spotterai.jwt.secret=${JWT_SECRET}

# 4. CORS
spotterai.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# 5. DEBUGGING
spring.jpa.show-sql=true
