# Levanta SpotterAI entero: base de datos, backend y frontend.
#
#   docker compose up
#
# La aplicación queda en http://localhost:4200, ya con gente dentro: se entra
# con demo@spotterai.test / Demo1234. El backend no publica puerto a propósito:
# todo el tráfico pasa por nginx, que es lo que hace que el frontend no necesite
# saber dónde vive la API.

services:
  base:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-spotterai}
      MARIADB_DATABASE: ${DB_NAME:-spotterai_db}
      # utf8mb4 desde el principio: la aplicación está en español y con la
      # codificación por defecto los acentos se guardan mal.
      MARIADB_AUTO_UPGRADE: "1"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    volumes:
      - datos-base:/var/lib/mysql
    healthcheck:
      # El backend arranca con ddl-auto=validate y Flyway: si la base no está
      # lista, no reintenta, se cae. De ahí que espere al healthcheck.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    depends_on:
      base:
        condition: service_healthy
    environment:
      DB_HOST: base
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-spotterai_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-spotterai}
      # Sin valor por defecto seguro a propósito: para desarrollo vale este,
      # pero cualquier despliegue real tiene que ponerlo en un .env.
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-cambiala-antes-de-desplegar-nada}
      # nginx sirve la aplicación desde su propio origen, así que las peticiones
      # ya no cruzan orígenes. Se mantiene por si alguien ataca la API directa.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      MEDIOS_DIR: /app/medios
      # Siembra gente, horarios que solapan y un par de planes en marcha. Sin
      # esto, quien levanta el proyecto ve una aplicación vacía y no llega a ver
      # el motor de compatibilidad, que es lo único que merece la pena enseñar.
      # Para una base con datos de verdad, quítalo.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-demo}
      # Avisos por correo. Apagados salvo que se configuren: con CORREO_ACTIVO
      # en false no se manda nada y los avisos van al registro del contenedor,
      # que es lo que deja verlos con `docker compose logs backend`.
      CORREO_ACTIVO: ${CORREO_ACTIVO:-false}
      # Lo primero que hay que cambiar al desplegar de verdad: si esto se queda
      # en localhost, los correos salen con enlaces que no le sirven a nadie.
      CORREO_URL_BASE: ${CORREO_URL_BASE:-http://localhost:4200}
      CORREO_REMITENTE: "${CORREO_REMITENTE:-SpotterAI <no-responder@spotterai.local>}"
      CORREO_HOST: ${CORREO_HOST:-localhost}
      CORREO_PUERTO: ${CORREO_PUERTO:-587}
      CORREO_USUARIO: ${CORREO_USUARIO:-}
      CORREO_CLAVE: ${CORREO_CLAVE:-}
      # Solo para depurar: en produccion llena el disco y deja datos de la gente
      # escritos en texto plano en los logs.
      SQL_AL_REGISTRO: ${SQL_AL_REGISTRO:-false}
    volumes:
      # Fuera de la imagen: si no, cada despliegue borra las fotos subidas.
      - medios:/app/medios

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  datos-base:
  medios:
