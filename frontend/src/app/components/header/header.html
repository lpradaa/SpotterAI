<header class="header">
  <div class="header__left">
    <button class="header__button" (click)="toggleSidebar()" aria-label="Abrir menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <a routerLink="/dashboard" class="header__logo-container" aria-label="SpotterAI, ir al inicio">
      <!--
        Marca de SpotterAI. El isotipo es una barra con discos y, debajo, el arco
        de la mano que asiste: eso es literalmente un spotter. El texto va en dos
        nodos porque "Spotter" y "AI" llevan grosores distintos.
      -->
      <svg viewBox="0 0 232 50" class="logo-svg" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="SpotterAI">
        <defs>
          <linearGradient id="saAscua" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#c2410c" />
          </linearGradient>
        </defs>

        <g>
          <!-- Barra -->
          <rect x="10" y="20" width="40" height="5" rx="2.5" fill="url(#saAscua)" />
          <!-- Discos -->
          <rect x="6" y="13" width="7" height="19" rx="3.5" fill="url(#saAscua)" />
          <rect x="47" y="13" width="7" height="19" rx="3.5" fill="url(#saAscua)" />
          <!-- Arco de la mano que asiste -->
          <path d="M 12 36 Q 30 46 48 36" fill="none" stroke="url(#saAscua)"
                stroke-width="4" stroke-linecap="round" opacity="0.55" />
        </g>

        <!-- currentColor lo fija .header__logo-container: sin color explicito el
             enlace heredaba el azul de link por defecto del navegador. -->
        <text x="66" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26"
              font-weight="700" fill="currentColor" dominant-baseline="middle"
              letter-spacing="-0.5">Spotter<tspan font-weight="500"
              fill="var(--sa-acento)">AI</tspan></text>
      </svg>
    </a>
  </div>
  
  <div class="header__right">
    <button class="header__button" (click)="alternarTema()"
            [attr.aria-label]="'Cambiar a tema ' + (temaActual() === 'oscuro' ? 'claro' : 'oscuro')"
            [title]="'Cambiar a tema ' + (temaActual() === 'oscuro' ? 'claro' : 'oscuro')">
      @if (temaActual() === 'oscuro') {
        <!-- Sol: pasar a claro -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      } @else {
        <!-- Luna: pasar a oscuro -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      }
    </button>
  </div>
</header>

<div class="backdrop" [class.backdrop--show]="isSidebarOpen()" (click)="toggleSidebar()"></div>

<aside class="sidebar" [class.sidebar--open]="isSidebarOpen()">
  
  <div class="sidebar__header">
    <button class="sidebar__close-btn" (click)="toggleSidebar()" aria-label="Cerrar menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="sidebar__user-profile" *ngIf="isLoggedIn()">
    <div class="sidebar__avatar">{{ currentUser().initial }}</div>
    <div class="sidebar__user-info">
      <span class="sidebar__user-name">{{ currentUser().name }}</span>
      <span class="sidebar__user-email">{{ currentUser().email }}</span>
    </div>
  </div>

  <hr class="sidebar__divider" />

  <nav class="sidebar__nav">
    <!-- Iconos de trazo en vez de emoticonos: se tiñen con currentColor y
         siguen el estado activo del enlace, cosa que un emoji no puede hacer. -->
    <a routerLink="/dashboard" class="sidebar__nav-item" routerLinkActive="sidebar__nav-item--active" (click)="toggleSidebar()">
      <svg class="sidebar__nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect>
        <rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect>
      </svg>
      Tablero
    </a>

    <a routerLink="/conexiones" class="sidebar__nav-item" routerLinkActive="sidebar__nav-item--active" (click)="toggleSidebar()">
      <svg class="sidebar__nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      Compañeros
    </a>

    <a routerLink="/explorar" class="sidebar__nav-item" routerLinkActive="sidebar__nav-item--active" (click)="toggleSidebar()">
      <svg class="sidebar__nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      Explorar
    </a>
  </nav>

  <div class="sidebar__footer">
    <button class="sidebar__auth-button" (click)="cerrarSesion()">
      Cerrar Sesión
    </button>
  </div>
</aside>
