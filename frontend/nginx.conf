server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones al backend salen del mismo origen que la aplicación, así
    # que nginx las reenvía. Esto es lo que permite que el frontend compilado no
    # lleve dentro ninguna dirección concreta, y de paso elimina el CORS: para
    # el navegador todo viene de aquí.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El canal de eventos es una respuesta que no termina: con el búfer
        # activado nginx la retiene esperando a llenarlo y los mensajes llegan
        # a ráfagas o no llegan.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # Las subidas de vídeo pasan de los 8 KB que nginx admite por defecto.
        client_max_body_size 16m;
    }

    # Angular resuelve las rutas en el navegador: cualquier URL desconocida
    # tiene que devolver index.html o recargar en /explorar daría un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros con huella en el nombre no cambian nunca de contenido.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
